<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.meta_description }}{% endblock %}">

  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{% block og_title %}{{ site.name }}{% endblock %}">
  <meta property="og:description" content="{{ site.meta_description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ url_for('static', filename='img/logo-full.png', _external=True) }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{ url_for('static', filename='img/logo-mark.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead">
    <div class="wrap">
      <a class="masthead__brand" href="/" aria-label="{{ site.name }} home">
        <img src="{{ url_for('static', filename='img/logo-nav.png') }}" alt="{{ site.name }}" width="640" height="283">
      </a>
    </div>
  </header>

  <main id="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flash-wrap">
        {% for category, message in messages %}
        <div class="flash flash--{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="colophon">
    <div class="wrap colophon__inner">
      <p>&copy; {{ current_year }} {{ site.name }}. All rights reserved.</p>
      <a class="colophon__portal" href="{{ url_for('portal') }}">Portal</a>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
